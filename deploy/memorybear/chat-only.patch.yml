# Trim the Web surface to a conversation-only product. Applied as a launcher
# overlay after the brand layer:
#
#   dsh web --patch deploy/memorybear/brand.patch.yml \
#           --patch deploy/memorybear/local-vllm.patch.yml \
#           --patch deploy/memorybear/chat-only.patch.yml
#
# Everything here is a row disable, so the surface is a deployment decision and
# nothing upstream had to change: dropping this file restores the full GUI.

# The Trajectory view. The conversation shell renders its view tab bar only when
# more than one view is registered (ConversationSession.tsx), so removing this
# row takes the whole Chat/Trajectory tab strip with it rather than leaving a
# single lonely tab.
- id: ui-trajectory
  disabled: true

# The composer's model picker and the /model command. This deployment pins one
# route in local-vllm.patch.yml, so a picker could only offer the user a way to
# select something that is not configured.
- id: ui-model-selection
  disabled: true

# The Agent presets settings section. This deployment ships exactly one preset
# and makes it the default, so the section could only offer a choice of one —
# and it is also an authoring surface: a preset IS a composition, so writing one
# carries the same trust as shell access.
- id: ui-agent-preset
  disabled: true

# The Models settings page: provider rows, API-key fields, model catalogue
# editing. Same reason — the route is a deployment fact here, not a user choice.
#
# NOTE this row also owns the first-run onboarding dialogs, so disabling it also
# removes the internal-testing notice and the credential setup step. That is the
# intended trade here (a product with a fixed local model needs neither), but it
# is why the notice disappears, rather than something breaking.
- id: ui-settings-models
  disabled: true

# ── surfaces that name other products ───────────────────────────────────────
#
# These are the last places the GUI itself showed a foreign brand to the user,
# which is the whole point of removing them rather than a tidiness preference.

# The Plugins settings section: per-namespace configuration cards. It is also a
# host-plane control surface, which a chat product has no reason to expose.
- id: ui-settings-plugins
  disabled: true

# The plugin inventory. It lists every composed row by package name, so it puts
# the entire @deepseek-ai/dsh-* namespace in front of the user.
- id: ui-settings-plugin-inventory
  disabled: true

# The Cordis inspection surface. It is named after the vendored framework and
# presents the composition itself.
- id: ui-cordis
  disabled: true

# ── panels whose capability this deployment does not mount ───────────────────
#
# Each of these renders a projection of something the MemoryBear preset no
# longer contributes, so leaving them mounted would show permanently empty
# panels. Their host-plane registries stay; only the surfaces go.

# Subagent panels — the preset mounts no delegation group.
- id: ui-subagent
  disabled: true

# Workflow run records — the preset mounts no workflow engine.
- id: ui-workflow-run
  disabled: true

# Goal panel — the preset mounts no goal tool.
- id: ui-goal
  disabled: true
