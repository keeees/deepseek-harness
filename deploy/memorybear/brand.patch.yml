# MemoryBear brand overlay — a launcher patch layer applied over the composed
# `web` profile:
#
#   dsh web --patch deploy/memorybear/brand.patch.yml
#
# It is a WRAPPER, not a rename: every upstream package keeps its own name, so
# the fork stays mergeable with deepseek-ai/deepseek-harness. Only what a
# browser user actually sees moves to MemoryBear. The browser tab title and the
# in-app document title are the one brand surface this file cannot reach — they
# are build-time values, so pair this overlay with a build that sets
# DSH_CLIENT_TITLE=MemoryBear (see the `memorybear` scripts in package.json).

# The upstream occupants register only in an artifact build whose
# DSH_CLIENT_BUILD_PROFILE is `official`, so they are already inert here.
# Disabling them is explicit belt-and-braces: an accidental official build must
# not mix two brands in one sidebar.
- id: ui-brand-official
  disabled: true

# The MemoryBear occupants for `sidebar.brand.mark`, `sidebar.brand.name`, and
# `conversation.hero.brand.mark`. Unlike the official package this one has no
# self-gate: being mounted here IS the decision.
- insert:
    - id: ui-brand-memorybear
      name: '@deepseek-ai/dsh-client-ui-brand-memorybear'

# Drop the fixed upstream identity sentence ("You are an AI agent powered by
# DeepSeek Harness.") that would otherwise open every system prompt.
#
# The MemoryBear identity itself is deliberately NOT set here. A `persona` on
# this row is the DEPLOYMENT default, and every agent preset this app ships
# mounts its own `dsh-persona` row, which shadows it — so a persona configured
# here renders for nobody. The identity lives in the presets instead:
# apps/cli/config/agent-presets/<preset>/agent.cordis.yml. Verified by reading
# the assembled prompt out of a session log, not by reading the composed config,
# because the composed config shows a persona that the preset then replaces.
- id: system-prompt
  config:
    includeHarnessIdentity: false

# Mount MemoryBear's own agent preset instead of the shipped `standard` one.
#
# A preset is where the persona and the context-injection rows live, and a
# preset file is not reachable from a host patch layer — so owning the preset is
# what lets this deployment state its identity and choose what reaches the model
# without editing anything upstream. `deploy/memorybear/agent-presets/memorybear`
# is a copy of `standard` with three differences, each explained at its site:
# the persona names MemoryBear and constrains how other product names may be
# used, and the `agent-instructions` and skill-discovery rows are absent because
# both injected this checkout's own harness documentation into every prompt.
#
# Only `default` is stated here. `roots` deliberately is NOT: the shipped preset
# root is an assembly fact that `apps/cli`'s `composeProfile` patches onto this
# row AFTER every launcher overlay, so a `roots` value set here is replaced
# before the roster ever reads it — the composed config prints it and the running
# roster ignores it, which is exactly how long it took to notice.
#
# The preset therefore has to arrive through the one root the app patch does not
# own: `includeUserRoot` appends `$DSH_HOME/.agent-presets` after every
# configured root. The deployment symlinks the whole preset DIRECTORY in there:
#
#   ln -sfn <checkout>/deploy/memorybear/agent-presets $DSH_HOME/.agent-presets
#
# so the versioned copy stays the source of truth and a pull updates it. It has
# to be the directory, not the preset inside it: discovery lists candidates with
# readdir(withFileTypes) and keeps only entries where isDirectory() is true,
# which a symlink-to-directory is not — so linking a single preset into a real
# `.agent-presets` directory silently finds nothing.
#
# If the link is missing, session creation fails with agent-preset-not-found
# rather than falling back — name `standard` here to recover.
#
# One layer still outranks this value: a persisted `agent-presets.default` in
# $DSH_HOME/settings.yaml wins over composed config, and the (now disabled)
# preset picker wrote exactly that key. A deployment that has ever had it set
# keeps obeying the file, so check there first when new sessions come up on the
# wrong preset. Sessions also record their own choice — resume prefers the newest
# `agent-preset/selected` entry in the log over this default, by design.
- id: agent-presets
  config:
    default: memorybear

# Stop injecting the two developer-orientation prompt sections that `dsh web`
# adds by default. This single flag removes both, and it is the only lever that
# reaches them: their text is built in code, so no patch can rewrite it, and the
# alternative the bundle documents — `complete: true` on the preset persona —
# suppresses EVERY other section, including the read/write/edit/glob/grep/bash
# guidance the tools depend on.
#
# What goes away, and why each one had to:
#
#   * The harness-source section named a different product to the model on the
#     very first line of every prompt, and told it the checkout is there "to
#     inspect or extend" that product. Nothing else in the prompt could outrank
#     a statement in position one.
#   * The web-surface section advertised the wrong address. It always prints a
#     loopback URL derived from the bind, so it said 127.0.0.1:3081 while users
#     reach this deployment at https://192.168.111.146 through nginx — the model
#     would hand out an address no user can open. The rest of that section is an
#     update contract about `pnpm run dev:web`, HMR receivers, Vite entries and
#     rebuilding `apps/web`, which is accurate for a developer checkout and
#     meaningless to a chat user who cannot rebuild anything.
#
# Also dropped is the DSH_WEB_URL shell variable, which only mattered to an
# agent editing its own GUI.
#
# Removing these is what lets the preset persona stop enumerating foreign names:
# a translation rule only has to cover names the model can actually still see.
#
# The other three keys are restated verbatim from the shipped row because patch
# application replaces a `config` mapping WHOLE — it is not a deep merge. Naming
# `surfaceContext` alone silently deletes its siblings, and the dangerous one is
# `trustedHosts`: it feeds the /api trust fence from `--trusted-host`, so losing
# it makes the fence reject the Host header nginx forwards and the GUI stops
# loading for every user, with the composed config looking perfectly reasonable.
# `printUrl` is the readiness line systemd watches for. Keep all four together.
- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts
