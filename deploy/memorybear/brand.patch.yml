# MemoryBear brand overlay — a launcher patch layer applied over the composed
# `web` profile:
#
#   dsh web --patch deploy/memorybear/brand.patch.yml
#
# It is a WRAPPER, not a rename: every upstream package keeps its own name, so
# the fork stays mergeable with deepseek-ai/deepseek-harness. Only what a
# browser user actually sees moves to MemoryBear. The browser tab title and the
# in-app document title are the one brand surface this file cannot reach — they
# are build-time values, so pair this overlay with a build that sets
# DSH_CLIENT_TITLE=MemoryBear (see the `memorybear` scripts in package.json).

# The upstream occupants register only in an artifact build whose
# DSH_CLIENT_BUILD_PROFILE is `official`, so they are already inert here.
# Disabling them is explicit belt-and-braces: an accidental official build must
# not mix two brands in one sidebar.
- id: ui-brand-official
  disabled: true

# The MemoryBear occupants for `sidebar.brand.mark`, `sidebar.brand.name`, and
# `conversation.hero.brand.mark`. Unlike the official package this one has no
# self-gate: being mounted here IS the decision.
- insert:
    - id: ui-brand-memorybear
      name: '@deepseek-ai/dsh-client-ui-brand-memorybear'

# Drop the fixed upstream identity sentence ("You are an AI agent powered by
# DeepSeek Harness.") that would otherwise open every system prompt.
#
# The MemoryBear identity itself is deliberately NOT set here. A `persona` on
# this row is the DEPLOYMENT default, and every agent preset this app ships
# mounts its own `dsh-persona` row, which shadows it — so a persona configured
# here renders for nobody. The identity lives in the presets instead:
# apps/cli/config/agent-presets/<preset>/agent.cordis.yml. Verified by reading
# the assembled prompt out of a session log, not by reading the composed config,
# because the composed config shows a persona that the preset then replaces.
- id: system-prompt
  config:
    includeHarnessIdentity: false
