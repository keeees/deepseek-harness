# Connection header for proxied websocket upgrades. nginx defines no
# $connection_upgrade of its own: a proxied request must send "upgrade" only
# when the client asked for one, and "close" otherwise, or keepalive breaks.
#
# This lives in conf.d rather than the site file because `map` is only valid at
# http level, while the site is a set of server blocks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
