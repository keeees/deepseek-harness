<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="MemoryBear">
  <title>MemoryBear</title>
  <!-- Geometry traced from the MemoryBear product icon: every feature is
       centred on x=24, and the head is widest below its vertical midpoint. -->
  <!-- Ears sit behind the head, so the head silhouette clips their inner edge. -->
  <circle cx="11" cy="11" r="5" fill="#DD3838"/>
  <circle cx="37" cy="11" r="5" fill="#DD3838"/>
  <!-- Head: broad round crown, widest at y≈29.5, tapering into a rounded chin. -->
  <path fill="#212332" d="M24 5.95C38.74 5.95 42.56 25.73 42.56 30.35C42.56 38.62 24.55 43.99 24 43.99C23.45 43.99 5.44 38.62 5.44 30.35C5.44 25.73 9.26 5.95 24 5.95Z"/>
  <!-- Muzzle. Its upper flanks fall under the wide lower arcs of the spectacle
       rims, which is why the visible white narrows at eye level. -->
  <ellipse cx="24" cy="28" rx="8" ry="9" fill="#FFFFFF"/>
  <!-- Spectacles: unfilled rims, so the head colour reads as the eyes. -->
  <g fill="none" stroke="#DD3838" stroke-width="2">
    <circle cx="16" cy="21" r="4"/>
    <circle cx="32" cy="21" r="4"/>
    <path d="M20.8 19.6Q24 16.9 27.2 19.6"/>
  </g>
  <circle cx="24" cy="28" r="3" fill="#DD3838"/>
  <path d="M20 34.1Q24 31.7 28 34.1" fill="none" stroke="#212332" stroke-width="1.2" stroke-linecap="round"/>
</svg>
